name: ai-ui-generator

# Production compose — uses pre-built images from Azure Container Registry.
# Dev-only services (mongo-express, sonarqube, ollama) are excluded.
# All build: directives replaced by image: from ACR.

services:

  mongo:
    image: mongo:7
    container_name: ai-ui-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai_ui_generator
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: ai-ui-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: ai-ui-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-ai-ui-files} || true;
      mc anonymous set none local/${MINIO_BUCKET:-ai-ui-files} || true;
      echo 'minio bucket ready';
      "

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: ai-ui-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      # No port — nginx routes port 80 → Keycloak; issuer/token URLs use port 80
      KC_HOSTNAME_URL: http://${VM_PUBLIC_IP}
    volumes:
      - ./keycloak/realm-ai-ui.json:/opt/keycloak/data/import/realm-ai-ui.json:ro
      - ./keycloak/themes/ai-ui-theme:/opt/keycloak/themes/ai-ui-theme:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  fastapi-ai:
    image: ${ACR_LOGIN_SERVER}/fastapi-ai:${IMAGE_TAG:-latest}
    container_name: ai-ui-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      NO_LOCAL_MODEL: "true"
      PLANNER_PROVIDER: groq
      CODER_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_PLANNER_MODEL: llama-3.3-70b-versatile
      GROQ_CODER_MODEL: llama-3.3-70b-versatile
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-changeme-in-prod}
      CORS_ALLOWED_ORIGINS: http://${VM_PUBLIC_IP}:5173,http://${VM_PUBLIC_IP}:8081
      PROJECTS_DIR: /app/projects
    volumes:
      - projects_data:/app/projects

  spring-bff:
    image: ${ACR_LOGIN_SERVER}/spring-bff:${IMAGE_TAG:-latest}
    container_name: ai-ui-spring-bff
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fastapi-ai:
        condition: service_healthy
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/ai_ui_generator
      FASTAPI_BASE_URL: http://fastapi-ai:8000
      FASTAPI_TIMEOUT_SECONDS: 3600
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      CORS_ALLOWED_ORIGINS: https://talanted.westeurope.cloudapp.azure.com,http://${VM_PUBLIC_IP},http://${VM_PUBLIC_IP}:5173
      APP_SECURITY_DEV_MODE: "false"
      # Issuer must match KC_HOSTNAME_URL (no port — nginx is the entry point)
      OAUTH_ISSUER: http://${VM_PUBLIC_IP}/realms/ai-ui
      OAUTH_JWKS_URI: http://keycloak:8080/realms/ai-ui/protocol/openid-connect/certs

  frontend:
    image: ${ACR_LOGIN_SERVER}/frontend:${IMAGE_TAG:-latest}
    container_name: ai-ui-frontend
    restart: unless-stopped
    depends_on:
      spring-bff:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      # These are build-time ARGs baked by Jenkinsfile — kept here for documentation only
      VITE_BFF_BASE_URL: ""
      VITE_GENERATION_TIMEOUT_MS: 3600000
      VITE_OIDC_AUTHORITY: http://${VM_PUBLIC_IP}/realms/ai-ui
      VITE_OIDC_CLIENT_ID: ai-ui-frontend
      VITE_OIDC_REDIRECT_URI: http://${VM_PUBLIC_IP}/auth/callback

  # ── Nginx — reverse proxy (port 80) ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-ui-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/ai-ui-generator/ssl/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - spring-bff
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/realms/ai-ui"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  transcript-streaming:
    image: ${ACR_LOGIN_SERVER}/transcript-streaming:${IMAGE_TAG:-latest}
    container_name: ai-ui-transcript-streaming
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEFAULT_LANGUAGE: ${TRANSCRIPT_LANGUAGE:-en}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ── Monitoring ───────────────────────────────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ai-ui-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-ui-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: ai-ui-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  mongo_data:
  minio_data:
  keycloak_data:
  projects_data:
  prometheus_data:
  grafana_data:
