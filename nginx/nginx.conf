events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name talanted.westeurope.cloudapp.azure.com;

        ssl_certificate     /etc/letsencrypt/live/talanted.westeurope.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/talanted.westeurope.cloudapp.azure.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Keycloak — auth server (before SPA catch-all)
        location ~ ^/(realms|resources|js)/ {
            proxy_pass         http://keycloak:8080;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Port   443;
            proxy_buffer_size  128k;
            proxy_buffers      4 256k;
            proxy_cookie_flags ~. secure samesite=lax;
        }

        # Spring BFF REST API
        location /api/ {
            proxy_pass         http://spring-bff:8080;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket — real-time collaboration (STOMP/SockJS)
        location /ws/ {
            proxy_pass         http://spring-bff:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # Preview — generated UI (proxied by Spring BFF → FastAPI)
        location /preview/ {
            proxy_pass       http://spring-bff:8080;
            proxy_set_header Host $host;
        }

        # Transcript streaming (speech-to-requirements)
        location /transcript/stream/ {
            proxy_pass         http://transcript-streaming:5001/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # Frontend SPA — catch-all (must be last)
        location / {
            proxy_pass         http://frontend:5173;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }
    }
}
