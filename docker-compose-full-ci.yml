# Docker Compose — Complete Stack with Jenkins + SonarQube

If you want to run EVERYTHING together (recommended for local development):

```yaml
version: '3.8'

services:
  # ========== EXISTING SERVICES ==========

  mongo:
    image: mongo:7
    container_name: ai-ui-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_ui_generator
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: ai-ui-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_URL: http://localhost:8083
    volumes:
      - ./keycloak/realm-ai-ui.json:/opt/keycloak/data/import/realm-ai-ui.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/localhost/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'",
        ]
      interval: 5s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: ai-ui-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: ai-ui-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-ai-ui-files} || true;
      mc anonymous set none local/${MINIO_BUCKET:-ai-ui-files} || true;
      echo 'minio bucket ready';
      "

  fastapi-ai:
    image: ai-ui-generator-fastapi:latest
    build:
      context: ./fastapi-ai
    container_name: ai-ui-fastapi
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai_ui_generator
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-gemini}
      CODER_PROVIDER: ${CODER_PROVIDER:-gemini}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      NO_LOCAL_MODEL: ${NO_LOCAL_MODEL:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  spring-bff:
    image: ai-ui-generator-backend:latest
    build:
      context: ./spring-bff
    container_name: ai-ui-spring-bff
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      fastapi-ai:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai_ui_generator
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ai-ui
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ai-ui/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: spring-bff
      FASTAPI_ENDPOINT: http://fastapi-ai:8000
      APP_SECURITY_DEV_MODE: ${APP_SECURITY_DEV_MODE:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      GITLAB_PRIVATE_TOKEN: ${GITLAB_PRIVATE_TOKEN}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/user/me"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ai-ui-generator-frontend:latest
    build:
      context: ./frontend
    container_name: ai-ui-frontend
    restart: unless-stopped
    depends_on:
      spring-bff:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_KEYCLOAK_URL: http://localhost:8083
      VITE_KEYCLOAK_REALM: ai-ui
      VITE_KEYCLOAK_CLIENT_ID: web-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== NEW JENKINS + SONARQUBE SERVICES ==========

  # SonarQube Database
  sonarqube-db:
    image: postgres:15-alpine
    container_name: ai-ui-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SonarQube Server
  sonarqube:
    image: sonarqube:10.3.0-community
    container_name: ai-ui-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9010:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_HOST_URL: http://localhost:9010
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Jenkins Master
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: ai-ui-jenkins
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--httpPort=8080 -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      SONAR_TOKEN: ${SONAR_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      DOCKER_USERNAME: ${DOCKER_USERNAME}
      DOCKER_PASSWORD: ${DOCKER_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GIT_SSH_KEY: ${GIT_SSH_KEY}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/jenkins-casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
    user: root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  minio_data:
  keycloak_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:
