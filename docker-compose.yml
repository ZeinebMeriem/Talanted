name: ai-ui-generator

services:
  mongo:
    image: mongo:7
    container_name: ai-ui-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_ui_generator
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: ai-ui-mongo-express
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: ai-ui-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://localhost:8083}
    volumes:
      - ./keycloak/realm-ai-ui.json:/opt/keycloak/data/import/realm-ai-ui.json:ro
      - ./keycloak/themes/ai-ui-theme:/opt/keycloak/themes/ai-ui-theme:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/localhost/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'",
        ]
      interval: 5s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: ai-ui-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: ai-ui-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-ai-ui-files} || true;
      mc anonymous set none local/${MINIO_BUCKET:-ai-ui-files} || true;
      echo 'minio bucket ready';
      "

  fastapi-ai:
    build:
      context: ./fastapi-ai
      dockerfile: Dockerfile
    container_name: ai-ui-fastapi
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      AI_OUTPUT_TARGET: ${AI_OUTPUT_TARGET:-react}
      AI_SPEC_BUILDER: ${AI_SPEC_BUILDER:-ollama}
      # ── Per-role provider selection (groq|gemini|openai|ollama) ──
      # NO_LOCAL_MODEL=true => never fall back to Ollama
      NO_LOCAL_MODEL: ${NO_LOCAL_MODEL:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:cloud}
      OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen3.5:cloud}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-groq}
      CODER_PROVIDER: ${CODER_PROVIDER:-groq}
      PLANNER_MAX_TOKENS: ${PLANNER_MAX_TOKENS:-1200}
      CODER_MAX_TOKENS: ${CODER_MAX_TOKENS:-8192}
      EDIT_FILE_MOCK: ${EDIT_FILE_MOCK:-false}
      # ── Groq ── (ACTIVE - fast, free 30 RPM)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_PLANNER_MODEL: ${GROQ_PLANNER_MODEL:-llama-3.3-70b-versatile}
      GROQ_CODER_MODEL: ${GROQ_CODER_MODEL:-llama-3.3-70b-versatile}
      # ── Google Gemini ── (fallback only)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-exp}
      GEMINI_PLANNER_MODEL: ${GEMINI_PLANNER_MODEL:-}
      GEMINI_CODER_MODEL: ${GEMINI_CODER_MODEL:-}
      # ── All other providers disabled ──
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # OLLAMA_BASE_URL: disabled
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-changeme-in-prod}
      CORS_ALLOWED_ORIGINS: ${FASTAPI_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://ai-ui-spring-bff:8080}
      # MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # ── NVIDIA NIM ──
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-deepseek-ai/deepseek-v3.2}
      NVIDIA_PLANNER_MODEL: ${NVIDIA_PLANNER_MODEL:-}
      NVIDIA_CODER_MODEL: ${NVIDIA_CODER_MODEL:-}
      # ── Kimi K2.6 (Azure AI) ──
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://jawhe-movktvos-eastus2.services.ai.azure.com/openai/v1/}
      KIMI_MODEL: ${KIMI_MODEL:-Kimi-K2.6}
      # ── Pexels (free image API) ──
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PROJECTS_DIR: /app/projects
    volumes:
      - ./projects:/app/projects

  spring-bff:
    build:
      context: ./spring-bff
      dockerfile: Dockerfile
    container_name: ai-ui-spring-bff
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fastapi-ai:
        condition: service_healthy
    ports:
      - "8081:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/ai_ui_generator
      FASTAPI_BASE_URL: http://fastapi-ai:8000
      # Two-model pipeline: planner (~30s) + per-file coder (~600s × N files)
      FASTAPI_TIMEOUT_SECONDS: ${FASTAPI_TIMEOUT_SECONDS:-3600}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-ui-files}
      CORS_ALLOWED_ORIGINS: ${BFF_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://frontend:5173}
      # PRODUCTION MODE: Enable Keycloak OAuth2 authentication
      APP_SECURITY_DEV_MODE: "false"
      # GitLab OAuth credentials
      GITLAB_OAUTH_CLIENT_ID: "d1152c3ca144adc13273603e6baea0abbc6ec04ab913c2b7bf1f6056190b528e"
      GITLAB_OAUTH_CLIENT_SECRET: "gloas-aa32cd15325996201e6c1c5a67e71aa289781499343fcdaca602b3b31510d585"
      GITLAB_OAUTH_REDIRECT_URI: "http://127.0.0.1:8081/api/gitlab/auth/callback"
      # Only needed when dev-mode is false:
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8083/realms/ai-ui}
      OAUTH_JWKS_URI: http://keycloak:8080/realms/ai-ui/protocol/openid-connect/certs
      # Email service (SMTP)
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@ai-ui-generator.local}
      # Jira Integration
      # Intentionally no default base URL — set JIRA_BASE_URL in your .env
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      # Labels to auto-detect "frontend" tasks to list from a board/project URL
      JIRA_FRONTEND_LABELS: ${JIRA_FRONTEND_LABELS:-ui,interface,ux}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-ui-frontend
    restart: unless-stopped
    depends_on:
      spring-bff:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      VITE_BFF_BASE_URL:
      VITE_GENERATION_TIMEOUT_MS: 3600000
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8083/realms/ai-ui}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-ai-ui-frontend}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/auth/callback}
      # Windows + Docker bind mounts often miss FS events. Force polling so UI changes apply reliably.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend/src:/app/src

  sonarqube-db:
    image: postgres:15-alpine
    container_name: ai-ui-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarPassword123
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.5.1-community
    container_name: ai-ui-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9010:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarPassword123
      SONAR_WEB_JAVAOPTS: -Xmx2048m -Xms1024m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      # /api/system/status does NOT require auth (unlike /api/system/health in SonarQube 10.x)
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── Transcript AI — Speech-to-Requirements ──────────────────────────────────
  transcript-streaming:
    build:
      context: ./transcript-ai
      dockerfile: Dockerfile.streaming
    container_name: ai-ui-transcript-streaming
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PIPELINE_API_URL: ""
      OLLAMA_BASE_URL: http://ollama:11434
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5:3b}
      DEFAULT_LANGUAGE: ${TRANSCRIPT_LANGUAGE:-en}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  transcript-pipeline:
    build:
      context: ./transcript-ai
      dockerfile: Dockerfile.pipeline
    container_name: ai-ui-transcript-pipeline
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PIPELINE_PORT: "8082"
      OLLAMA_BASE_URL: http://ollama:11434
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5:3b}
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      - transcript_chroma:/app/chroma_db
      - transcript_outputs:/app/pipeline_outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  ollama:
    image: ollama/ollama:latest
    container_name: ai-ui-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'

  # ── Monitoring ──────────────────────────────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ai-ui-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          memory: 128m

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: ai-ui-mongo-exporter
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb://mongo:27017"
    command:
      - '--collect-all'
      - '--compatible-mode'
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          memory: 64m

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ai-ui-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    entrypoint: >
      sh -c "echo \"$${SLACK_WEBHOOK_URL}\" > /etc/alertmanager/slack_webhook_url &&
             /bin/alertmanager
             --config.file=/etc/alertmanager/alertmanager.yml
             --storage.path=/alertmanager
             --web.external-url=http://localhost:9093"
    deploy:
      resources:
        limits:
          memory: 64m

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-ui-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  grafana:
    image: grafana/grafana:latest
    container_name: ai-ui-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_DATABASE_WAL: "true"
      GF_DATABASE_CACHE_MODE: shared
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'

volumes:
  mongo_data:
  minio_data:
  keycloak_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  transcript_chroma:
  transcript_outputs:
  ollama_data:
