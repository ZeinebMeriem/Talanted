# Loaded automatically by ALL test classes (no @ActiveProfiles needed).
# Profile-specific file application-test.properties still exists for @DataMongoTest tests.

app.fastapi.base-url=http://localhost:8000
app.security.dev-mode=true
app.keycloak.internal-url=http://localhost:8083
app.keycloak.realm=ai-ui
app.minio.endpoint=http://localhost:9000
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket=ai-ui-test

# Use localhost MongoDB for unit/slice tests; @DataMongoTest overrides this via the test profile
spring.data.mongodb.uri=mongodb://localhost:27017/ai_ui_test

# Prevent mail auto-configuration from failing in CI
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
