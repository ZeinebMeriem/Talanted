server:
  port: 8080

spring:
  application:
    name: spring-bff
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ai_ui_generator}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    timeout-seconds: ${FASTAPI_TIMEOUT_SECONDS:3600}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ai-ui-files}
  upload:
    max-bytes: 10485760 # 10MB
    allowed-mime: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,image/png,image/jpeg
  keycloak:
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:ai-ui}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
