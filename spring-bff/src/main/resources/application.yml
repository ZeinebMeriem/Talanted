server:
  port: 8080

spring:
  application:
    name: spring-bff
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ai_ui_generator}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    timeout-seconds: ${FASTAPI_TIMEOUT_SECONDS:3600}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ai-ui-files}
  upload:
    max-bytes: 52428800 # 50MB
    allowed-mime: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/markdown,text/csv,text/html,text/css,text/javascript,application/json,application/xml,application/yaml,image/png,image/jpeg,image/gif,image/webp,image/bmp,image/svg+xml
  keycloak:
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:ai-ui}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
