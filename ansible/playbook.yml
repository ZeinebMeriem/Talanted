---
- name: Deploy AI UI Generator on Azure VM
  hosts: azure_vm
  become: true
  gather_facts: true

  tasks:

    # ── 1. System packages ────────────────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - rsync
        state: present

    # ── 2. Install Docker ─────────────────────────────────────────────────────
    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: true

    # ── 3. Login to Azure Container Registry ─────────────────────────────────
    - name: Login to ACR
      shell: |
        echo "{{ acr_password }}" | docker login {{ acr_login_server }} \
          -u {{ acr_username }} --password-stdin
      no_log: true

    # ── 4. Create app directory ───────────────────────────────────────────────
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    # ── 5. Copy docker-compose ────────────────────────────────────────────────
    - name: Copy docker-compose.prod.yml
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: azureuser
        group: azureuser
        mode: "0644"

    # ── 6. Copy Keycloak configs (realm + themes) ─────────────────────────────
    - name: Create keycloak directory
      file:
        path: "{{ app_dir }}/keycloak"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    - name: Copy Keycloak realm and themes
      synchronize:
        src: ../keycloak/
        dest: "{{ app_dir }}/keycloak/"
        delete: false
        rsync_opts:
          - "--chown=azureuser:azureuser"

    # ── 7a. Copy nginx config ─────────────────────────────────────────────────
    - name: Create nginx directory
      file:
        path: "{{ app_dir }}/nginx"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    - name: Copy nginx config
      copy:
        src: ../nginx/nginx.conf
        dest: "{{ app_dir }}/nginx/nginx.conf"
        owner: azureuser
        group: azureuser
        mode: "0644"

    # ── 7. Copy monitoring configs ────────────────────────────────────────────
    - name: Create monitoring directories
      file:
        path: "{{ item }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"
      loop:
        - "{{ app_dir }}/monitoring/prometheus"
        - "{{ app_dir }}/monitoring/grafana/provisioning"

    - name: Copy Prometheus config
      synchronize:
        src: ../monitoring/prometheus/
        dest: "{{ app_dir }}/monitoring/prometheus/"
        delete: false
        rsync_opts:
          - "--chown=azureuser:azureuser"

    - name: Copy Grafana provisioning
      synchronize:
        src: ../monitoring/grafana/provisioning/
        dest: "{{ app_dir }}/monitoring/grafana/provisioning/"
        delete: false
        rsync_opts:
          - "--chown=azureuser:azureuser"

    # ── 8. Generate .env file ─────────────────────────────────────────────────
    - name: Generate .env file
      copy:
        dest: "{{ app_dir }}/.env"
        owner: azureuser
        group: azureuser
        mode: "0600"
        content: |
          # Generated by Ansible — do not edit manually
          IMAGE_TAG={{ image_tag }}
          ACR_LOGIN_SERVER={{ acr_login_server }}

          # VM networking (used by Keycloak, CORS, OIDC URLs)
          VM_PUBLIC_IP={{ vm_public_ip }}

          # MongoDB
          MONGO_INITDB_DATABASE=ai_ui_generator

          # MinIO
          MINIO_ROOT_USER={{ minio_root_user }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
          MINIO_BUCKET={{ minio_bucket }}

          # Keycloak
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD={{ keycloak_admin_pass }}

          # AI
          GROQ_API_KEY={{ groq_api_key }}
          GEMINI_API_KEY={{ gemini_api_key }}
          INTERNAL_API_SECRET={{ internal_api_secret }}

          # Transcription
          ELEVENLABS_API_KEY={{ elevenlabs_api_key }}

          # Monitoring
          GRAFANA_PASSWORD={{ grafana_password }}

          # Stripe Payments
          STRIPE_SECRET_KEY={{ stripe_secret_key }}
          STRIPE_PUBLISHABLE_KEY={{ stripe_publishable_key }}

          # Spring BFF
          APP_SECURITY_DEV_MODE=false

    # ── 9. Pull images from ACR ───────────────────────────────────────────────
    - name: Pull Docker images from ACR
      shell: docker compose pull
      args:
        chdir: "{{ app_dir }}"
      environment:
        COMPOSE_FILE: "{{ app_dir }}/docker-compose.yml"

    # ── 10. Start services ────────────────────────────────────────────────────
    - name: Start all services
      shell: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    # ── 11. Configure Keycloak SMTP (after Keycloak is healthy) ──────────────
    - name: Wait for Keycloak to be ready
      uri:
        url: "http://localhost:8083/realms/master"
        status_code: 200
      retries: 30
      delay: 10
      register: kc_ready
      until: kc_ready.status == 200

    - name: Get Keycloak admin token
      uri:
        url: "http://localhost:8083/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          grant_type: password
          username: admin
          password: "{{ keycloak_admin_pass }}"
        status_code: 200
      register: kc_token

    - name: Configure Keycloak SMTP
      uri:
        url: "http://localhost:8083/admin/realms/ai-ui"
        method: PUT
        headers:
          Authorization: "Bearer {{ kc_token.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          smtpServer:
            host: "{{ mail_host | default('smtp.gmail.com') }}"
            port: "{{ mail_port | default('587') }}"
            from: "{{ mail_from }}"
            fromDisplayName: "Talented"
            replyTo: "{{ mail_from }}"
            auth: "true"
            starttls: "true"
            ssl: "false"
            user: "{{ mail_username }}"
            password: "{{ mail_password }}"
        status_code: 204

    # ── 12. Health check ──────────────────────────────────────────────────────
    - name: Wait for Spring BFF to be healthy
      uri:
        url: "http://localhost:8081/actuator/health"
        status_code: 200
      retries: 12
      delay: 10
      register: health_result
      until: health_result.status == 200

    - name: Print deployment summary
      debug:
        msg:
          - "Deployment complete — build #{{ image_tag }}"
          - "   Frontend  : http://{{ vm_public_ip }}:5173"
          - "   API       : http://{{ vm_public_ip }}:8081"
          - "   Keycloak  : http://{{ vm_public_ip }}:8083"
          - "   Grafana   : http://{{ vm_public_ip }}:3000"
          - "   MinIO     : http://{{ vm_public_ip }}:9001"
