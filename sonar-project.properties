# SonarQube Project Configuration
# This file is used by sonar-scanner CLI and can be referenced in GitHub Actions

# Project Identification
sonar.projectName=AI UI Generator
sonar.projectVersion=1.0.0

# Source Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (files to ignore in analysis)
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts,**/venv/**,**/__pycache__/**

# Coverage
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/tests/**

# Code Smell & Quality Thresholds (optional)
# sonar.qualitygate.wait=true
