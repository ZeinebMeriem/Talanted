jenkins:
  systemMessage: "AI UI Generator — Jenkins CI/CD Pipeline"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

  remotingSecurity:
    enabled: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "github-token"
              scope: GLOBAL
              username: "${GITHUB_USER:-MeriemBoukraa}"
              password: "${GITHUB_TOKEN:-changeme}"
              description: "GitHub Personal Access Token"
          - string:
              id: "sonar-token"
              scope: GLOBAL
              secret: "${SONAR_TOKEN:-changeme}"
              description: "SonarQube Analysis Token"
          - string:
              id: "gitlab-token"
              scope: GLOBAL
              secret: "${GITLAB_TOKEN:-changeme}"
              description: "GitLab Personal Access Token"
          - usernamePassword:
              id: "docker-registry-credentials"
              scope: GLOBAL
              username: "${DOCKER_REGISTRY_USER:-}"
              password: "${DOCKER_REGISTRY_PASS:-}"
              description: "Docker Hub credentials (set DOCKER_REGISTRY_USER / DOCKER_REGISTRY_PASS in jenkins/.env)"
          - usernamePassword:
              id: "azure-acr-credentials"
              scope: GLOBAL
              username: "${ACR_USERNAME:-talantedacr2026}"
              password: "${ACR_PASSWORD:-changeme}"
              description: "Azure Container Registry credentials"
          - string:
              id: "groq-api-key"
              scope: GLOBAL
              secret: "${GROQ_API_KEY:-changeme}"
              description: "Groq API Key for FastAPI AI"
          - basicSSHUserPrivateKey:
