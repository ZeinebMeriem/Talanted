version: '3.8'

services:
  # PostgreSQL for SonarQube (required)
  sonarqube-db:
    image: postgres:15-alpine
    container_name: ai-ui-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SonarQube Server
  sonarqube:
    image: sonarqube:10.5.1-community
    container_name: ai-ui-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9010:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_HOST_URL: http://localhost:9010
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Jenkins Master
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ui-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--httpPort=8080 -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/jenkins-config/jenkins-casc.yaml
      GITHUB_TOKEN: ${GITHUB_TOKEN:-changeme}
      GITHUB_USER: ${GITHUB_USER:-MeriemBoukraa}
      SONAR_TOKEN: ${SONAR_TOKEN:-changeme}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-changeme}
      DOCKER_REGISTRY_USER: ${DOCKER_REGISTRY_USER:-}
      DOCKER_REGISTRY_PASS: ${DOCKER_REGISTRY_PASS:-}
      # DOCKER_HOST is picked up automatically from .env if set
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/var/jenkins_home/jenkins-config
    user: root
    extra_hosts:
      # Makes host.docker.internal resolvable on Linux hosts (no-op on Docker Desktop)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:
