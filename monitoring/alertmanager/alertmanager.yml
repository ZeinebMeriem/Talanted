global:
  resolve_timeout: 5m
  # Slack webhook URL is injected at container start from $SLACK_WEBHOOK_URL env var.
  # Set it in your .env file: SLACK_WEBHOOK_URL=https://hooks.slack.com/services/XXX/YYY/ZZZ
  # If not set, alerts will only be visible in the Alertmanager UI (localhost:9093).
  slack_api_url_file: '/etc/alertmanager/slack_webhook_url'

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'
  routes:
    - matchers:
        - severity = critical
      receiver: 'slack-critical'
      repeat_interval: 1h
    - matchers:
        - severity = warning
      receiver: 'slack-notifications'
      repeat_interval: 4h

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#ai-ui-alerts'
        username: 'Prometheus AlertManager'
        icon_emoji: ':bell:'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}{{ if .Labels.component }} / {{ .Labels.component }}{{ end }}
          *Since:* {{ .StartsAt | since }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Prometheus'
            url: 'http://localhost:9090/alerts'
          - type: button
            text: 'View in Grafana'
            url: 'http://localhost:3000'

  - name: 'slack-critical'
    slack_configs:
      - channel: '#ai-ui-alerts'
        username: 'Prometheus AlertManager'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Since:* {{ .StartsAt | since }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Prometheus'
            url: 'http://localhost:9090/alerts'

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'service']
