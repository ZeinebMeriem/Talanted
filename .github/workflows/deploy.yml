name: Deploy to Production

on:
  workflow_run:
    workflows: ["Full Stack CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Stack
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Spring BFF
        uses: docker/build-push-action@v6
        with:
          context: ./spring-bff
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-bff:latest
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FastAPI
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi-ai
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-fastapi:latest
            ${{ secrets.DOCKER_USERNAME }}/ui-generator-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment to Docker Hub completed"
          echo "Frontend : ${{ secrets.DOCKER_USERNAME }}/ui-generator-frontend:${{ github.sha }}"
          echo "BFF      : ${{ secrets.DOCKER_USERNAME }}/ui-generator-bff:${{ github.sha }}"
          echo "FastAPI  : ${{ secrets.DOCKER_USERNAME }}/ui-generator-fastapi:${{ github.sha }}"
