name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Stack

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-frontend:latest
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Spring BFF
        uses: docker/build-push-action@v5
        with:
          context: ./spring-bff
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-bff:latest
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FastAPI
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi-ai
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-fastapi:latest
            ${{ secrets.DOCKER_REGISTRY }}/ui-generator-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment to Docker Hub completed"
          echo "Frontend: ${{ secrets.DOCKER_REGISTRY }}/ui-generator-frontend:${{ github.sha }}"
          echo "BFF: ${{ secrets.DOCKER_REGISTRY }}/ui-generator-bff:${{ github.sha }}"
          echo "FastAPI: ${{ secrets.DOCKER_REGISTRY }}/ui-generator-fastapi:${{ github.sha }}"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1
