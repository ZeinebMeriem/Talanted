name: Backend (Spring BFF) CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'spring-bff/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'spring-bff/**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test Spring BFF

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        working-directory: ./spring-bff
        run: mvn clean verify

      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ai-ui-generator-backend
            -Dsonar.sources=spring-bff/src/main/java
            -Dsonar.tests=spring-bff/src/test/java
            -Dsonar.java.source=17
            -Dsonar.java.binaries=spring-bff/target/classes
            -Dsonar.junit.reportPaths=spring-bff/target/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=spring-bff/target/site/jacoco/jacoco.xml

      - name: Check code quality
        working-directory: ./spring-bff
        run: mvn checkstyle:check || echo "⚠️  Checkstyle warnings found"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: spring-bff/target/surefire-reports
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spring-bff-jar
          path: spring-bff/target/*.jar
          retention-days: 5

  security:
    runs-on: ubuntu-latest
    name: OWASP Dependency Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run dependency check
        working-directory: ./spring-bff
        run: mvn dependency:tree

      - name: Scan for known vulnerabilities
        working-directory: ./spring-bff
        run: mvn org.owasp:dependency-check-maven:check || echo "⚠️  Vulnerabilities found - review required"
