name: FastAPI CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'fastapi-ai/**'
      - '.github/workflows/fastapi.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'fastapi-ai/**'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Lint FastAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./fastapi-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: ./fastapi-ai
        run: pip install ruff && ruff check app/ || echo "⚠️  Linting issues found"

      - name: Type check with mypy
        working-directory: ./fastapi-ai
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || echo "⚠️  Type checking issues found"

      - name: Run tests
        working-directory: ./fastapi-ai
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml || true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ai-ui-generator-fastapi
            -Dsonar.sources=fastapi-ai/app
            -Dsonar.tests=fastapi-ai/tests
            -Dsonar.python.coverage.reportPaths=fastapi-ai/coverage.xml
            -Dsonar.sourceEncoding=UTF-8

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./fastapi-ai/coverage.xml
          fail_ci_if_error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-test-reports
          path: fastapi-ai/htmlcov
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    name: Security Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./fastapi-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Bandit security scan
        working-directory: ./fastapi-ai
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Check for known vulnerabilities
        working-directory: ./fastapi-ai
        run: safety check --json || echo "⚠️  Vulnerabilities found - review required"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-security-reports
          path: fastapi-ai/bandit-report.json
          retention-days: 7
