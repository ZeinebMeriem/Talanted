name: Full Stack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build

  backend:
    runs-on: ubuntu-latest
    name: Backend CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: cd spring-bff && mvn clean package -DskipTests

  fastapi:
    runs-on: ubuntu-latest
    name: FastAPI CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: cd fastapi-ai && pip install -r requirements.txt
      - run: cd fastapi-ai && pytest tests/ -v || true

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build Check
    needs: [frontend, backend, fastapi]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Spring BFF image
        uses: docker/build-push-action@v5
        with:
          context: ./spring-bff
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi-ai
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    runs-on: ubuntu-latest
    name: CI Summary
    needs: [frontend, backend, fastapi, docker-build]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "✅ Frontend: ${{ needs.frontend.result }}"
          echo "✅ Backend: ${{ needs.backend.result }}"
          echo "✅ FastAPI: ${{ needs.fastapi.result }}"
          echo "✅ Docker: ${{ needs.docker-build.result }}"

      - name: Fail if any job failed
        if: |
          needs.frontend.result == 'failure' ||
          needs.backend.result == 'failure' ||
          needs.fastapi.result == 'failure' ||
          needs.docker-build.result == 'failure'
        run: exit 1
